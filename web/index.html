<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário TypeScript</title>
  </head>
  <body>
    <h2>Envio de Dados</h2>

    <form id="meu-formulario">
      <div>
        <label for="campo1">Número 1:</label>
        <input type="number" id="campo1" name="campo1" step="any" required />
      </div>
      <br />
      <div>
        <label for="operacao">Operação:</label>
        <select id="operacao" name="operacao" required>
          <option value="soma">Soma (+)</option>
          <option value="subtracao">Subtração (-)</option>
          <option value="multiplicacao">Multiplicação (x)</option>
          <option value="divisao">Divisão (/)</option>
        </select>
      </div>
      <br />
      <div>
        <label for="campo2">Número 2:</label>
        <input type="number" id="campo2" name="campo2" step="any" required />
      </div>
      <br />
      <button type="submit">Calcular / Enviar</button>
    </form>

    <div id="resposta" style="margin-top: 15px"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
